{% extends "base.html" %}
{% block title %}{{ code }} {{ title }} · OpenOJ{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-code">{{ code }}</div>
    <h1>{{ title }}</h1>
    <p class="error-message">{{ message }}</p>
    <a class="button" href="{{ url_for('index') }}">返回题库</a>
</div>
{% endblock %}
